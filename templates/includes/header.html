<header>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'mailing:home' %}">MailSender</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'mailing:home' %}">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href= >Статистика</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        {% if user.is_authenticated %}
<li class="nav-item">
    <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button type="submit" class="nav-link btn btn-link" style="display: inline; border: none; background: none; cursor: pointer;">
            Выход
        </button>
    </form>
</li>
                        {% else %}
        <li class="nav-item">
            <a class="nav-link" href="{% url 'users:login' %}">Вход</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
        </li>
    {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</header>

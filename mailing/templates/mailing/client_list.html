{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Список клиентов</h2>
    <a href="{% url 'clients:create' %}" class="btn btn-success mb-3">➕ Добавить клиента</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Email</th>
                <th>Ф. И. О.</th>
                <th>Комментарий</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ client.email }}</td>
                <td>{{ client.full_name }}</td>
                <td>{{ client.comment }}</td>
                <td>
                    <a href="{% url 'clients:detail' client.pk %}" class="btn btn-sm btn-info">👁️</a>
                    <a href="{% url 'clients:update' client.pk %}" class="btn btn-sm btn-primary">✏️</a>
                    <a href="{% url 'clients:delete' client.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4">Клиенты не найдены.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Удалить клиента</h2>
    <p>Вы уверены, что хотите удалить клиента <strong>{{ client.full_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
        <a href="{% url 'clients:list' %}" class="btn btn-secondary">← Отмена</a>
    </form>
</div>
{% endblock %}

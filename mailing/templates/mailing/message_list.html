{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Список сообщений</h2>
    <a href="{% url 'mailing:message_add' %}" class="btn btn-success mb-3">➕ Добавить сообщение</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Тема</th>
                <th>Дата создания</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for message in messages %}
            <tr>
                <td>{{ message.subject }}</td>
                <td>{{ message.created_at|date:"d.m.Y H:i" }}</td>
                <td>
                    <a href="{% url 'mailing:message_detail' message.pk %}" class="btn btn-sm btn-info">👁️</a>
                    <a href="{% url 'mailing:message_edit' message.pk %}" class="btn btn-sm btn-primary">✏️</a>
                    <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-danger">🗑️</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Сообщения не найдены.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

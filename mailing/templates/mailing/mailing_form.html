{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{% if mailing %}Редактировать рассылку{% else %}Добавить рассылку{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">💾 Сохранить</button>
        <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">← Отмена</a>
    </form>
</div>
{% endblock %}

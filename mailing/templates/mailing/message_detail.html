{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ message.subject }}</h2>
    <p><strong>Дата создания:</strong> {{ message.created_at|date:"d.m.Y H:i" }}</p>
    <p><strong>Текст:</strong></p>
    <div class="p-3 bg-light">{{ message.body|linebreaks }}</div>
    <a href="{% url 'mailing:message_edit' message.pk %}" class="btn btn-primary">✏️ Редактировать</a>
    <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-danger">🗑️ Удалить</a>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">← Назад</a>
</div>
{% endblock %}

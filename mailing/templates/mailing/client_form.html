{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{% if client %}Редактировать клиента{% else %}Добавить клиента{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">💾 Сохранить</button>
        <a href="{% url 'clients:list' %}" class="btn btn-secondary">← Отмена</a>
    </form>
</div>
{% endblock %}
